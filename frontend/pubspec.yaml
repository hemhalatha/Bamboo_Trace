name: bambootrace
description: A bamboo supply chain tracking Flutter application
publish_to: 'none' # since this is likely a private project

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  # Firebase core & services
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.7
  cloud_firestore: ^4.17.5

  # State management
  provider: ^6.1.1

  # Network requests if needed
  http: ^1.1.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
